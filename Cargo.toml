[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/formcraft/formcraft"

[workspace.dependencies]
# internal
formcraft-kernel = { path = "crates/kernel" }
formcraft-occt = { path = "crates/occt" }
formcraft-sketch = { path = "crates/sketch" }
formcraft-doc = { path = "crates/doc" }
formcraft-regen = { path = "crates/regen" }
formcraft-tess = { path = "crates/tess" }
formcraft-io = { path = "crates/io" }
formcraft-engine = { path = "crates/engine" }
formcraft-ai = { path = "crates/ai" }
formcraft-plugin = { path = "crates/plugin" }
formcraft-plugin-api = { path = "crates/plugin-api" }
formcraft-render = { path = "crates/render" }
formcraft-ui-egui = { path = "crates/ui-egui" }
formcraft-mcp = { path = "crates/mcp" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
glam = { version = "0.30", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

# C++ kernel bridge
cxx = "1"
cxx-build = "1"
occt-sys = "=7.8.1"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11", "wayland"] }
egui-wgpu = "0.36"
# must match egui-wgpu's wgpu
wgpu = { version = "30", default-features = false, features = ["wgsl", "dx12", "vulkan", "metal", "gles"] }
pollster = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
egui_kittest = "0.36"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
