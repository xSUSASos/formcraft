[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formcraft"
version = "0.1.0"
description = "Scripting client for the FormCraft parametric CAD (loopback control channel)"
readme = "README.md"
