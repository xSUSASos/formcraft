name: Release

on:
  push:
    tags: ["v*", "phase-7"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  dist:
    name: dist (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake clang \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libfuse2
          curl -sSL -o /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy

      - name: WiX (msi)
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-directories: target/OCCT

      - name: cargo xtask dist
        run: cargo xtask dist

      - uses: actions/upload-artifact@v4
        with:
          name: formcraft-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.AppImage
          if-no-files-found: warn
